<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tesserak-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="62%" stop-color="#111827" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tesserak-bg)" />

  <!-- Outer isometric cube -->
  <polygon
    points="32,11 50.2,21.5 50.2,42.5 32,53 13.8,42.5 13.8,21.5"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Hypercube connectors -->
  <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="11" x2="32" y2="21.5" />
    <line x1="50.2" y1="21.5" x2="41.1" y2="26.75" />
    <line x1="50.2" y1="42.5" x2="41.1" y2="37.25" />
    <line x1="32" y1="53" x2="32" y2="42.5" />
    <line x1="13.8" y1="42.5" x2="22.9" y2="37.25" />
    <line x1="13.8" y1="21.5" x2="22.9" y2="26.75" />
  </g>

  <!-- Inner cube faces -->
  <polygon points="32,21.5 41.1,26.75 32,32 22.9,26.75" fill="rgba(59,130,246,0.34)" />
  <polygon points="32,32 41.1,26.75 41.1,37.25 32,42.5" fill="rgba(255,255,255,0.22)" />

  <!-- Inner cube wireframe -->
  <polygon
    points="32,21.5 41.1,26.75 41.1,37.25 32,42.5 22.9,37.25 22.9,26.75"
    stroke="#93c5fd"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <path
    d="M22.9 26.75 L32 32 L41.1 26.75 M32 32 L32 42.5"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="32" r="2.4" fill="#ffffff" />
</svg>
